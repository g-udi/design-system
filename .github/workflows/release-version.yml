name: Release Version

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to apply
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease
      dry_run:
        description: Run checks and calculate the next version without committing
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: "github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'chore(release): v')"
    uses: ./.github/workflows/validation.yml

  bump-version:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_BUMP: ${{ github.event.inputs.bump || 'patch' }}
      RELEASE_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Bump package version
        run: node scripts/bump-version.mjs

      - name: Commit release version
        if: env.RELEASE_DRY_RUN != 'true'
        run: |
          if git diff --quiet -- package.json; then
            echo "No version changes to commit."
            exit 0
          fi

          version="$(node -p "require('./package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v${version}"
          git tag -a "v${version}" -m "Gaudi v${version}"
          git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "refs/tags/v${version}"
