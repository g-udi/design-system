name: Package validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check catalogue freshness and copyable examples
        run: |
          node scripts/sync-story-catalogue.mjs --check
          node scripts/verify-pattern-sources.mjs

      - name: Run contracts and ownership guards
        run: pnpm test:contracts

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Validate the packed package in a production consumer
        run: pnpm test:consumer

      - name: Run interactions, accessibility, and responsive checks in both themes
        env:
          VITE_GAUDI_AUDIT: '1'
          VITE_GAUDI_AUDIT_THEMES: both
        run: pnpm test-storybook:run

      - name: Check container layouts
        env:
          VITE_GAUDI_VISUAL: '1'
        run: pnpm test-storybook:run

      - name: Build Storybook
        run: pnpm build-storybook
