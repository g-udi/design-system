name: Package validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check catalogue freshness and copyable examples
        run: |
          node scripts/sync-story-catalogue.mjs --check
          node scripts/verify-pattern-sources.mjs

      - name: Run contracts and ownership guards
        run: pnpm test:contracts

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Validate the packed package in a production consumer
        run: pnpm test:consumer

  storybook:
    name: Storybook ${{ matrix.mode }} ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [responsive, visual]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - name: Run every assigned story in light and dark
        env:
          GAUDI_STORY_SHARD: ${{ matrix.shard }}/8
          GAUDI_STORYBOOK_REPORT_DIR: ${{ runner.temp }}/storybook-report
          VITE_GAUDI_AUDIT: ${{ matrix.mode == 'responsive' && '1' || '0' }}
          VITE_GAUDI_VISUAL: ${{ matrix.mode == 'visual' && '1' || '0' }}
        run: pnpm test-storybook:run
      - name: Save story results and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: storybook-${{ matrix.mode }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/storybook-report
          if-no-files-found: error
          retention-days: 3

  validate:
    needs: [package, storybook]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Require the package and every Storybook shard to pass
        if: needs.package.result != 'success' || needs.storybook.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Storybook
        run: pnpm build-storybook
