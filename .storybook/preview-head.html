<link rel="icon" href="./static/favicons/favicon.ico?v=gaudi-dark-tile" type="image/x-icon" />
<link rel="icon" href="./static/favicons/favicon-32x32.png?v=gaudi-dark-tile" type="image/png" sizes="32x32" />
<link rel="icon" href="./static/favicons/favicon-16x16.png?v=gaudi-dark-tile" type="image/png" sizes="16x16" />
<link rel="icon" href="./static/favicons/favicon.svg?v=gaudi-dark-tile" type="image/svg+xml" sizes="any" />
<link rel="apple-touch-icon" href="./static/favicons/apple-touch-icon.png?v=gaudi-dark-tile" />
<link rel="manifest" href="./static/favicons/site.webmanifest" />
<script>
  // Play functions stay as tests (Vitest and CI run them) but do not autoplay in the
  // Storybook canvas, where their clicks make stories flicker on open. Storybook skips
  // autoplay for embedded previews and keeps the flag across story navigation.
  (() => {
    const params = new URLSearchParams(window.location.search);
    if (window.parent === window || !params.has('id') || params.has('embed')) return;

    params.set('embed', 'true');
    window.history.replaceState(window.history.state, '', `${window.location.pathname}?${params}${window.location.hash}`);
  })();

  (() => {
    const globals = new URLSearchParams(window.location.search).get('globals') || '';
    const isDark = globals.split(';').includes('theme:dark');

    if (!isDark) return;

    document.documentElement.classList.add('dark');
    document.documentElement.style.colorScheme = 'dark';
  })();
</script>
<style>
  html.dark,
  html.dark body {
    background: #171717;
    color-scheme: dark;
  }
</style>
