<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sample video player</title>
<!-- A local stand-in for an embedded video player, so Storybook never loads a third-party embed. -->
<style>
  :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
  html, body { height: 100%; margin: 0; background: #0c0a09; color: #fafaf9; overflow: hidden; }
  .stage { position: relative; height: 100%; display: grid; place-items: center; background: radial-gradient(120% 90% at 20% 10%, #134e4a 0%, #0c0a09 60%), #0c0a09; }
  .orb { position: absolute; width: 46vmin; height: 46vmin; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #5eead4, #0f766e 55%, transparent 70%); filter: blur(2px); opacity: .55; animation: drift 9s ease-in-out infinite alternate; }
  .caption { position: relative; text-align: center; padding: 0 24px; }
  .caption strong { display: block; font-size: clamp(16px, 4vw, 28px); }
  .caption span { color: #a8a29e; font-size: clamp(12px, 2.4vw, 15px); }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; align-items: center; padding: 10px 14px; background: linear-gradient(transparent, rgba(0,0,0,.7)); font-size: 12px; font-variant-numeric: tabular-nums; }
  .track { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); overflow: hidden; }
  .fill { height: 100%; width: 0; background: #2dd4bf; }
  @keyframes drift { from { transform: translate(-18%, -8%) scale(.9); } to { transform: translate(18%, 8%) scale(1.1); } }
  @media (prefers-reduced-motion: reduce) { .orb { animation: none; } }
</style>
</head>
<body>
<div class="stage" role="img" aria-label="Sample video">
  <div class="orb"></div>
  <div class="caption"><strong>Designing with tokens</strong><span>Sample recording for documentation</span></div>
  <div class="bar"><span id="time">0:00</span><div class="track"><div class="fill" id="fill"></div></div><span>3:00</span></div>
</div>
<script>
  (() => {
    const params = new URLSearchParams(location.search);
    const length = 180;
    let at = Math.min(Number(params.get('start')) || 0, length);
    const playing = params.get('autoplay') === '1';
    const time = document.getElementById('time');
    const fill = document.getElementById('fill');
    const paint = () => {
      time.textContent = `${Math.floor(at / 60)}:${String(Math.floor(at % 60)).padStart(2, '0')}`;
      fill.style.width = `${(at / length) * 100}%`;
    };
    paint();
    if (playing) setInterval(() => { at = Math.min(at + 1, length); paint(); }, 1000);
  })();
</script>
</body>
</html>
